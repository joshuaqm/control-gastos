services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: finance_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_password}
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - finance_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_user} -d ${POSTGRES_DB:-finance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PgAdmin (opcional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finance_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@finance.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    networks:
      - finance_network
    depends_on:
      - postgres
    restart: unless-stopped

  # Backend Node.js
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: finance_backend
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-finance_user}:${POSTGRES_PASSWORD:-finance_password}@postgres:5432/${POSTGRES_DB:-finance_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8443
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8000:8000"
    networks:
      - finance_network
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm run dev:backend
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: finance_frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8443:8443"
    networks:
      - finance_network
    depends_on:
      - backend
    command: pnpm run dev:frontend
    restart: unless-stopped

  # Nginx (proxy inverso)
  nginx:
    image: nginx:alpine
    container_name: finance_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    networks:
      - finance_network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

networks:
  finance_network:
    driver: bridge

volumes:
  postgres_data: